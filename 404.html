<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — Horizon</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/horizon/icons/icon.svg" type="image/svg+xml" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
      background: #000 url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1800&q=70') center / cover; }
    main { max-width: 520px; padding: 40px 28px; border-radius: 24px; background: rgba(0,0,0,.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    p.code { margin: 0; font-size: 15px; font-weight: 600; opacity: .7; letter-spacing: .1em; }
    h1 { margin: 8px 0 12px; font-size: clamp(34px, 7vw, 52px); line-height: 1.05; letter-spacing: -.03em; }
    p { margin: 0 0 26px; font-size: 18px; color: rgba(255,255,255,.85); }
    a { display: inline-block; padding: 12px 24px; border-radius: 980px; background: #0071e3; color: #fff; text-decoration: none; font-size: 17px; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERREUR 404</p>
    <h1>Cette page s'est perdue en chemin.</h1>
    <p>L'adresse demandée n'existe pas ou a été déplacée.</p>
    <a href="/horizon/">Retour à l'accueil</a>
  </main>
</body>
</html>
